<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>
  <link rel="icon" href="images/favicon-32x32.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <img class="capa" src="images/illustration-hero.svg" alt="Person listening to music with headphones">

    <section class="conteudo" aria-labelledby="titulo">
      <h1 id="titulo">Order Summary</h1>
      <p class="descricao">
        You can now listen to millions of songs, audiobooks, and podcasts on any
        device anywhere you like!
      </p>

      <div class="plano">
        <img src="images/icon-music.svg" alt="" width="48" height="48">
        <div class="info-plano">
          <h2>Annual Plan</h2>
          <p>$59.99/year</p>
        </div>
        <button class="alterar" type="button">Change</button>
      </div>

      <button class="pagamento" type="button">Proceed to Payment</button>
      <button class="cancelar" type="button">Cancel Order</button>
    </section>
  </main>
</body>
</html>
